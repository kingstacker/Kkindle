name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要创建或重新发布的版本标签，例如 v0.6.0-dev.4"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Windows release
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_DIR: ${{ github.workspace }}\artifacts\github-release
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Resolve version and release tag
        id: version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "版本标签必须符合 vX.Y.Z 或 vX.Y.Z-prerelease：$env:RELEASE_TAG"
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

          $existingTag = git tag --list $env:RELEASE_TAG
          if ($existingTag -eq $env:RELEASE_TAG) {
            git checkout --detach "refs/tags/$env:RELEASE_TAG"
            "tag_exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "tag_exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Restore dependencies
        run: dotnet restore Kkindle.sln -p:Platform=x64

      - name: Run release tests
        run: dotnet test Kkindle.sln -c Release -p:Platform=x64 --no-restore

      - name: Build Avalonia Windows head
        run: dotnet build src/Kkindle.Desktop.Windows/Kkindle.Desktop.Windows.csproj -c Release -p:Platform=x64 --no-restore

      - name: Install release toolchain
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey 安装发布工具失败：$LASTEXITCODE" }

      - name: Build installer and portable package
        shell: pwsh
        run: |
          .\scripts\Build-Release.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -OutputRoot $env:RELEASE_DIR

      - name: Generate bilingual release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $notesPath = Join-Path $env:RUNNER_TEMP 'kkindle-release-notes.md'
          $notesEnglishPath = Join-Path $env:RUNNER_TEMP 'kkindle-release-notes.en.md'

          function Get-ReleaseSection([string] $path, [string] $releaseVersion) {
            if (-not (Test-Path -LiteralPath $path)) { return '' }
            $lines = @(Get-Content -LiteralPath $path)
            $headingPattern = '^##\s+\[?v?' + [regex]::Escape($releaseVersion) + '\]?(?:\s|$)'
            $start = -1
            for ($index = 0; $index -lt $lines.Count; $index++) {
              if ($lines[$index] -match $headingPattern) {
                $start = $index + 1
                break
              }
            }
            if ($start -lt 0) { return '' }
            $end = $lines.Count
            for ($index = $start; $index -lt $lines.Count; $index++) {
              if ($lines[$index] -match '^##\s+') {
                $end = $index
                break
              }
            }
            if ($end -le $start) { return '' }
            return (($lines[$start..($end - 1)] -join [Environment]::NewLine).Trim())
          }

          $changelogZh = Get-ReleaseSection 'CHANGELOG.md' $version
          $changelogEn = Get-ReleaseSection 'CHANGELOG.en.md' $version
          if ([string]::IsNullOrWhiteSpace($changelogZh)) {
            $changelogZh = "## 更新内容`n`nKkindle $version。"
          }

          $body = "<!-- kkindle-release-notes:zh-CN -->`n## 中文`n$changelogZh"
          if (-not [string]::IsNullOrWhiteSpace($changelogEn)) {
            $body += "`n`n<!-- kkindle-release-notes:en-US -->`n## English`n$changelogEn"
          }
          Set-Content -LiteralPath $notesPath -Value $body -Encoding utf8NoBOM
          Set-Content -LiteralPath $notesEnglishPath -Value $changelogEn -Encoding utf8NoBOM

      - name: Create release tag
        if: steps.version.outputs.tag_exists == 'false'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $env:RELEASE_TAG -m "Kkindle $env:RELEASE_TAG"
          git push origin "refs/tags/$env:RELEASE_TAG"

      - name: Create or update Windows GitHub Release
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $setupName = "Kkindle-$version-win-x64-setup.exe"
          $checksumName = "SHA256SUMS.txt"
          $setupFile = Get-Item -LiteralPath (Join-Path $env:RELEASE_DIR $setupName)
          $checksumFile = Get-Item -LiteralPath (Join-Path $env:RELEASE_DIR $checksumName)
          $downloadBase = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $manifest = [ordered]@{
            tag_name = $env:RELEASE_TAG
            html_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
            body = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'kkindle-release-notes.md') -Raw
            body_en = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'kkindle-release-notes.en.md') -Raw
            draft = $false
            prerelease = $version -match '-'
            assets = @(
              [ordered]@{
                name = $setupName
                browser_download_url = "$downloadBase/$setupName"
                size = $setupFile.Length
              },
              [ordered]@{
                name = $checksumName
                browser_download_url = "$downloadBase/$checksumName"
                size = $checksumFile.Length
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content `
            -LiteralPath (Join-Path $env:RELEASE_DIR 'update-manifest.json') `
            -Encoding utf8NoBOM
          $assets = @(Get-ChildItem -File $env:RELEASE_DIR | ForEach-Object { $_.FullName })
          $releaseArgs = @(
            $env:RELEASE_TAG,
            "--repo", $env:GITHUB_REPOSITORY,
            "--title", "Kkindle $env:RELEASE_TAG",
            "--verify-tag"
          )
          if ($version -match '-') { $releaseArgs += "--prerelease" }

          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName |
            ConvertFrom-Json
          $releaseExists = $null -ne ($releases | Where-Object { $_.tagName -eq $env:RELEASE_TAG })
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG $assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --notes-file (Join-Path $env:RUNNER_TEMP 'kkindle-release-notes.md')
          } else {
            gh release create @releaseArgs $assets --notes-file (Join-Path $env:RUNNER_TEMP 'kkindle-release-notes.md')
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Kkindle-${{ steps.version.outputs.version }}-win-x64
          path: |
            ${{ env.RELEASE_DIR }}/*.exe
            ${{ env.RELEASE_DIR }}/*.zip
            ${{ env.RELEASE_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
