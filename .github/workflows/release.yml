name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的版本标签，例如 v1.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Avalonia Windows release
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_DIR: ${{ github.workspace }}\artifacts\github-release

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "版本标签必须符合 vX.Y.Z 或 vX.Y.Z-prerelease：$env:RELEASE_TAG"
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($Matches.version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore Kkindle.sln -p:Platform=x64

      - name: Run release tests
        run: dotnet test Kkindle.sln -c Release -p:Platform=x64 --no-restore

      - name: Build Avalonia Windows head
        run: dotnet build src/Kkindle.Desktop.Windows/Kkindle.Desktop.Windows.csproj -c Release -p:Platform=x64 --no-restore

      - name: Install release toolchain
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey 安装发布工具失败：$LASTEXITCODE" }

      - name: Build installer and portable package
        shell: pwsh
        run: |
          .\scripts\Build-Release.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -OutputRoot $env:RELEASE_DIR

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Kkindle-${{ steps.version.outputs.version }}-win-x64
          path: |
            ${{ env.RELEASE_DIR }}/*.exe
            ${{ env.RELEASE_DIR }}/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - name: Resolve version
        id: version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)$ ]] || exit 1
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Build amd64 packages
        run: bash scripts/build-linux-release.sh '${{ steps.version.outputs.version }}' artifacts/linux linux-x64
      - name: Build arm64 packages
        run: bash scripts/build-linux-release.sh '${{ steps.version.outputs.version }}' artifacts/linux linux-arm64
      - name: Smoke-test Linux amd64 package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ./artifacts/linux/kkindle_${{ steps.version.outputs.version }}_amd64.deb xvfb
          set +e
          xvfb-run -a timeout --signal=TERM --kill-after=5s 20s /usr/bin/kkindle \
            > "$RUNNER_TEMP/kkindle-linux-release.log" 2>&1
          status=$?
          set -e
          if [[ "$status" != 124 ]]; then
            cat "$RUNNER_TEMP/kkindle-linux-release.log"
            echo "Kkindle exited before the Linux release smoke-test timeout (status $status)." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Kkindle-${{ steps.version.outputs.version }}-linux
          path: artifacts/linux/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: Build macOS packages
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - name: Resolve version
        id: version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)$ ]] || exit 1
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Prepare optional Apple signing and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE_P12_BASE64" \
            && -z "$APPLE_CERTIFICATE_PASSWORD" \
            && -z "$APPLE_NOTARY_KEY_BASE64" \
            && -z "$APPLE_NOTARY_KEY_ID" \
            && -z "$APPLE_NOTARY_ISSUER" ]]; then
            echo "Apple distribution credentials are not configured; building an ad-hoc signed package."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "APPLE_REQUIRE_NOTARIZATION=0" >> "$GITHUB_ENV"
            echo "MACOS_DISTRIBUTION_MODE=adhoc" >> "$GITHUB_ENV"
            exit 0
          fi

          : "${APPLE_CERTIFICATE_P12_BASE64:?Missing APPLE_CERTIFICATE_P12_BASE64 secret}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD secret}"
          : "${APPLE_NOTARY_KEY_BASE64:?Missing APPLE_NOTARY_KEY_BASE64 secret}"
          : "${APPLE_NOTARY_KEY_ID:?Missing APPLE_NOTARY_KEY_ID secret}"
          : "${APPLE_NOTARY_ISSUER:?Missing APPLE_NOTARY_ISSUER secret}"

          keychain="$RUNNER_TEMP/kkindle-build.keychain-db"
          keychain_password="${APPLE_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          certificate="$RUNNER_TEMP/kkindle-developer-id.p12"
          notary_key="$RUNNER_TEMP/kkindle-notary-key.p8"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 -D > "$notary_key"
          chmod 600 "$certificate" "$notary_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/security "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"

          identity="${APPLE_SIGNING_IDENTITY:-}"
          if [[ -z "$identity" ]]; then
            identity="$(security find-identity -v -p codesigning "$keychain" \
              | awk -F '"' '/Developer ID Application/{print $2; exit}')"
          fi
          [[ -n "$identity" ]] || { echo 'No Developer ID Application identity found' >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_REQUIRE_NOTARIZATION=1" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$notary_key" >> "$GITHUB_ENV"
          echo "MACOS_DISTRIBUTION_MODE=notarized" >> "$GITHUB_ENV"

      - name: Build Apple Silicon package
        run: bash scripts/build-macos-release.sh '${{ steps.version.outputs.version }}' artifacts/macos osx-arm64
      - name: Build Intel package
        run: bash scripts/build-macos-release.sh '${{ steps.version.outputs.version }}' artifacts/macos osx-x64
      - name: Validate macOS application
        shell: bash
        run: |
          set -euo pipefail
          validation_root="$RUNNER_TEMP/kkindle-macos-validation"
          mkdir -p "$validation_root"
          tar -xzf "artifacts/macos/Kkindle-${{ steps.version.outputs.version }}-osx-arm64.tar.gz" -C "$validation_root"
          plutil -lint "$validation_root/Kkindle.app/Contents/Info.plist"
          codesign --verify --deep --strict "$validation_root/Kkindle.app"
          if [[ "$MACOS_DISTRIBUTION_MODE" == "notarized" ]]; then
            xcrun stapler validate "$validation_root/Kkindle.app"
            spctl --assess --type execute --verbose=4 "$validation_root/Kkindle.app"
          else
            codesign -dv --verbose=4 "$validation_root/Kkindle.app" 2>&1 \
              | grep -q 'Signature=adhoc'
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Kkindle-${{ steps.version.outputs.version }}-macos
          path: artifacts/macos/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Clean Apple signing credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/kkindle-build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/kkindle-developer-id.p12" "$RUNNER_TEMP/kkindle-notary-key.p8"

  github-release:
    name: Publish three-platform release
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Kkindle-*
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Generate changelog from commits
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${RELEASE_TAG}" \
            --jq '.body' > "$RUNNER_TEMP/kkindle-release-notes.md"
          test -s "$RUNNER_TEMP/kkindle-release-notes.md"
      - name: Create update manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          setup_name="Kkindle-${version}-win-x64-setup.exe"
          checksum_name="SHA256SUMS.txt"
          test -f "artifacts/${setup_name}"
          test -f "artifacts/${checksum_name}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          download_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          jq -n \
            --arg tag_name "$RELEASE_TAG" \
            --arg html_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --rawfile body "$RUNNER_TEMP/kkindle-release-notes.md" \
            --arg setup_name "$setup_name" \
            --arg setup_url "${download_base}/${setup_name}" \
            --argjson setup_size "$(stat -c%s "artifacts/${setup_name}")" \
            --arg checksum_name "$checksum_name" \
            --arg checksum_url "${download_base}/${checksum_name}" \
            --argjson checksum_size "$(stat -c%s "artifacts/${checksum_name}")" \
            --argjson prerelease "$prerelease" \
            '{
              tag_name: $tag_name,
              html_url: $html_url,
              body: $body,
              draft: false,
              prerelease: $prerelease,
              assets: [
                { name: $setup_name, browser_download_url: $setup_url, size: $setup_size },
                { name: $checksum_name, browser_download_url: $checksum_url, size: $checksum_size }
              ]
            }' > artifacts/update-manifest.json
      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Kkindle $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/kkindle-release-notes.md"
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Kkindle $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/kkindle-release-notes.md" \
              "${prerelease[@]}"
          fi
