name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "留空根据所选分支的开发版本发布稳定版，也可填写已有标签"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve stable release version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Resolve release tag
        id: version
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        with:
          script: |
            let tag = process.env.REQUESTED_TAG?.trim();
            const masterPush = context.eventName === 'push' && context.ref === 'refs/heads/master';
            if (context.ref.startsWith('refs/tags/')) {
              tag = context.ref.replace('refs/tags/', '');
            } else if (!tag) {
              const { data: file } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: 'Directory.Build.props', ref: context.sha
              });
              const props = Buffer.from(file.content, 'base64').toString('utf8');
              const match = props.match(/<Version>(\d+\.\d+\.\d+)-dev\.\d+(?:\.\d+)?<\/Version>/);
              if (!match) throw new Error('Selected branch must contain an X.Y.Z-dev.N version');
              tag = `v${match[1]}`;
              if (masterPush) {
                const releases = await github.paginate(github.rest.repos.listReleases, {
                  owner: context.repo.owner, repo: context.repo.repo, per_page: 100
                });
                const candidates = releases.filter(r => !r.draft && /^v?\d+\.\d+\.\d+-dev\.\d+(?:\.\d+)?$/.test(r.tag_name));
                candidates.sort((a, b) => b.tag_name.replace(/^v/, '').localeCompare(a.tag_name.replace(/^v/, ''), 'en', { numeric: true }));
                for (const candidate of candidates) {
                  const candidateTag = `v${candidate.tag_name.replace(/^v/, '').split('-dev.')[0]}`;
                  if (candidateTag.localeCompare(tag, 'en', { numeric: true }) < 0) continue;
                  const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                    owner: context.repo.owner, repo: context.repo.repo,
                    basehead: `${candidate.tag_name}...${context.sha}`
                  });
                  if (comparison.status === 'ahead' || comparison.status === 'identical') {
                    tag = candidateTag;
                    break;
                  }
                }
              }
              try {
                await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`});
                if (masterPush) {
                  core.info(`Stable tag ${tag} already exists; skipping duplicate release`);
                  core.setOutput('publish', 'false');
                  return;
                }
                throw new Error(`Stable tag ${tag} already exists; specify it explicitly to rebuild`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.git.createRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `refs/tags/${tag}`, sha: context.sha
              });
            }
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag || '')) throw new Error('Invalid release tag');
            core.setOutput('tag', tag);
            core.setOutput('publish', 'true');
            core.info(`Release tag: ${tag}`);
  windows:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    name: Build and publish Avalonia Windows release
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_DIR: ${{ github.workspace }}\artifacts\github-release

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "版本标签必须符合 vX.Y.Z 或 vX.Y.Z-prerelease：$env:RELEASE_TAG"
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($Matches.version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore Kkindle.sln -p:Platform=x64

      - name: Run quick release tests
        run: dotnet test Kkindle.sln -c Release -p:Platform=x64 --no-restore

      - name: Build Avalonia Windows head
        run: dotnet build src/Kkindle.Desktop.Windows/Kkindle.Desktop.Windows.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true

      - name: Install release toolchain
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey 安装发布工具失败：$LASTEXITCODE" }

      - name: Build installer and portable package
        shell: pwsh
        run: |
          .\scripts\Build-Release.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -OutputRoot $env:RELEASE_DIR

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Kkindle-${{ steps.version.outputs.version }}-win-x64
          path: |
            ${{ env.RELEASE_DIR }}/*.exe
            ${{ env.RELEASE_DIR }}/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    name: Build Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - name: Resolve version
        id: version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)$ ]] || exit 1
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Build amd64 packages
        run: bash scripts/build-linux-release.sh '${{ steps.version.outputs.version }}' artifacts/linux linux-x64
      - name: Build arm64 packages
        run: bash scripts/build-linux-release.sh '${{ steps.version.outputs.version }}' artifacts/linux linux-arm64
      - name: Smoke-test Linux amd64 package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ./artifacts/linux/kkindle_${{ steps.version.outputs.version }}_amd64.deb xvfb
          set +e
          xvfb-run -a timeout --signal=TERM --kill-after=5s 20s /usr/bin/kkindle \
            > "$RUNNER_TEMP/kkindle-linux-release.log" 2>&1
          status=$?
          set -e
          if [[ "$status" != 124 ]]; then
            cat "$RUNNER_TEMP/kkindle-linux-release.log"
            echo "Kkindle exited before the Linux release smoke-test timeout (status $status)." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Kkindle-${{ steps.version.outputs.version }}-linux
          path: artifacts/linux/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    name: Build macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rid: osx-arm64
            runner: macos-15
          - arch: x64
            rid: osx-x64
            runner: macos-15-intel
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      # Icon Composer assets require Xcode 26; the runner defaults to Xcode 16.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - name: Resolve version
        id: version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)$ ]] || exit 1
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Run portable tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Kkindle.Tests/Kkindle.Tests.csproj -c Release
          dotnet test tests/Kkindle.Platform.Common.Tests/Kkindle.Platform.Common.Tests.csproj -c Release
          dotnet test tests/Kkindle.App.Tests/Kkindle.App.Tests.csproj -c Release
      - name: Configure Apple signing and notarization
        shell: bash
        run: |
          set -euo pipefail
          has_certificate=false
          [[ -n "${APPLE_CERTIFICATE_P12_BASE64:-}" ]] && has_certificate=true
          has_notary=false
          [[ -n "${APPLE_NOTARY_KEY_BASE64:-}${APPLE_NOTARY_KEY_ID:-}${APPLE_NOTARY_ISSUER:-}" ]] && has_notary=true

          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" && "$has_certificate" == false ]]; then
            echo "APPLE_SIGNING_IDENTITY requires APPLE_CERTIFICATE_P12_BASE64." >&2
            exit 1
          fi
          if [[ "$has_certificate" == false && "$has_notary" == false ]]; then
            echo "No Apple distribution credentials configured; the package will be ad-hoc signed."
            exit 0
          fi
          if [[ "$has_certificate" == false || "$has_notary" == false || -z "${APPLE_CERTIFICATE_PASSWORD:-}" || -z "${APPLE_NOTARY_KEY_BASE64:-}" || -z "${APPLE_NOTARY_KEY_ID:-}" || -z "${APPLE_NOTARY_ISSUER:-}" ]]; then
            echo "Configure APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_NOTARY_KEY_BASE64, APPLE_NOTARY_KEY_ID and APPLE_NOTARY_ISSUER together, or leave all of them unset for an ad-hoc build." >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/kkindle-signing.keychain-db"
          keychain_password="${APPLE_KEYCHAIN_PASSWORD:-$(openssl rand -hex 24)}"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/kkindle-certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/kkindle-certificate.p12" \
            -k "$keychain" -P "${APPLE_CERTIFICATE_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null

          identity="${APPLE_SIGNING_IDENTITY:-}"
          if [[ -z "$identity" ]]; then
            identity="$(security find-identity -v -p codesigning "$keychain" |
              sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          fi
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity was found in the imported certificate." >&2
            exit 1
          fi

          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          echo "$APPLE_NOTARY_KEY_BASE64" | base64 -D > "$notary_key"
          chmod 600 "$notary_key"
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_NOTARY_KEY_PATH=$notary_key"
            echo "APPLE_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"
            echo "APPLE_NOTARY_ISSUER=$APPLE_NOTARY_ISSUER"
            echo "APPLE_REQUIRE_NOTARIZATION=1"
          } >> "$GITHUB_ENV"
          echo "Configured Developer ID signing and notarization."
      - name: Build macOS package
        shell: bash
        run: bash scripts/build-macos-release.sh '${{ steps.version.outputs.version }}' artifacts/macos '${{ matrix.rid }}'
      - name: Verify and smoke-test macOS bundle
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/kkindle-smoke"
          mkdir -p "$work"
          tar -xzf "artifacts/macos/Kkindle-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz" -C "$work"
          plutil -lint "$work/Kkindle.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$work/Kkindle.app/Contents/Info.plist")" = Kkindle
          xcrun assetutil -Z "$work/Kkindle.app/Contents/Resources/Assets.car"
          codesign --verify --deep --strict "$work/Kkindle.app"
          dmg="artifacts/macos/Kkindle-${{ steps.version.outputs.version }}-${{ matrix.rid }}.dmg"
          hdiutil verify "$dmg"
          mountpoint="$RUNNER_TEMP/kkindle-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$dmg" >/dev/null
          trap 'hdiutil detach "$mountpoint" -force -quiet >/dev/null 2>&1 || true' EXIT
          test -d "$mountpoint/Kkindle.app"
          test -L "$mountpoint/Applications"
          test "$(readlink "$mountpoint/Applications")" = "/Applications"
          hdiutil detach "$mountpoint" >/dev/null
          log="$RUNNER_TEMP/kkindle-macos-smoke.log"
          "$work/Kkindle.app/Contents/MacOS/Kkindle" >"$log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log"
            echo "Kkindle exited during the macOS release smoke test." >&2
            exit 1
          fi
          kill -TERM "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: Kkindle-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: artifacts/macos/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  github-release:
    name: Publish Windows, Linux, and macOS release
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Checkout must run BEFORE the artifact download: it cleans the
      # workspace and would otherwise delete the downloaded release files.
      - name: Check out sources for changelog
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: Kkindle-*
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Generate detailed changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          changelog="$RUNNER_TEMP/kkindle-release-notes.md"
          changelog_en="$RUNNER_TEMP/kkindle-release-notes.en.md"

          extract_release_section() {
            local source="$1"
            local output="$2"
            : > "$output"
            if [[ -f "$source" ]]; then
              # Only a level-2 heading ends the section so "###" subsections survive.
              awk -v ver="$tag" '
                BEGIN { pattern = "^## +\\[?v?" ver "\\]?([) .:-]|$)" }
                $0 ~ pattern { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' "$source" > "$output" || true
              sed -i '/./,$!d' "$output"
            fi
          }

          # A matching section in either language is the curated release catalogue.
          extract_release_section CHANGELOG.md "$changelog"
          extract_release_section CHANGELOG.en.md "$changelog_en"

          # 2) Fall back to a detailed commit log since the previous tag.
          if [[ ! -s "$changelog" ]]; then
            prev_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
            range="${prev_tag:+${prev_tag}..}${RELEASE_TAG}"
            {
              echo "## 更新内容"
              echo
              if [[ -n "$prev_tag" ]]; then
                echo "范围：\`${prev_tag} → ${RELEASE_TAG}\`"
              else
                echo "首个发布版本。"
              fi
              echo
              git log --no-merges --date=short \
                --pretty=format:"- %ad %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" \
                "$range"
              echo
            } > "$changelog"
          fi

          {
            echo '<!-- kkindle-release-notes:zh-CN -->'
            echo '## 中文'
            cat "$changelog"
            if [[ -s "$changelog_en" ]]; then
              echo
              echo '<!-- kkindle-release-notes:en-US -->'
              echo '## English'
              cat "$changelog_en"
            fi
          } > "$RUNNER_TEMP/kkindle-release-notes.combined.md"
          mv "$RUNNER_TEMP/kkindle-release-notes.combined.md" "$changelog"

          test -s "$changelog"
          echo "----- release notes -----"
          cat "$changelog"
      - name: Create update manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          setup_name="Kkindle-${version}-win-x64-setup.exe"
          checksum_name="SHA256SUMS.txt"
          test -f "artifacts/${setup_name}"
          test -f "artifacts/${checksum_name}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          download_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          jq -n \
            --arg tag_name "$RELEASE_TAG" \
            --arg html_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --rawfile body "$RUNNER_TEMP/kkindle-release-notes.md" \
            --rawfile body_en "$RUNNER_TEMP/kkindle-release-notes.en.md" \
            --arg setup_name "$setup_name" \
            --arg setup_url "${download_base}/${setup_name}" \
            --argjson setup_size "$(stat -c%s "artifacts/${setup_name}")" \
            --arg checksum_name "$checksum_name" \
            --arg checksum_url "${download_base}/${checksum_name}" \
            --argjson checksum_size "$(stat -c%s "artifacts/${checksum_name}")" \
            --argjson prerelease "$prerelease" \
            '{
              tag_name: $tag_name,
              html_url: $html_url,
              body: $body,
              body_en: $body_en,
              draft: false,
              prerelease: $prerelease,
              assets: [
                { name: $setup_name, browser_download_url: $setup_url, size: $setup_size },
                { name: $checksum_name, browser_download_url: $checksum_url, size: $checksum_size }
              ]
            }' > artifacts/update-manifest.json
      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Kkindle $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/kkindle-release-notes.md"
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Kkindle $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/kkindle-release-notes.md" \
              "${prerelease[@]}"
          fi
